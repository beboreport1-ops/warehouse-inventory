<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إدارة المخزون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1013">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المخزون">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============================================================
     نظام التصميم — لغة "صناعية موثوقة" لأداة تشغيلية يومية
     العلامة: أزرق إشارة. الحالة: أخضر/كهرماني/أحمر (محجوزة للمخزون فقط)
     ============================================================ */
  :root{
    --bg:#0e1013;
    --surface:#16191d;
    --surface-2:#1e2227;
    --surface-3:#262b31;
    --line:#2a2f36;
    --line-soft:#20242a;
    --text:#eef0f2;
    --text-dim:#8b929b;
    --text-faint:#5c636b;

    --brand:#4c8dff;
    --brand-press:#3a74e0;

    --good:#33c17a;
    --warn:#e0a531;
    --bad:#ef5350;
    --bad-bg:rgba(239,83,80,.14);
    --bad-press:#d0413e;

    --radius-s:10px;
    --radius-m:14px;
    --radius-l:20px;

    --space-2:8px;
    --space-3:12px;
    --space-4:16px;
    --space-5:24px;
    --space-6:32px;

    --focus-ring: 0 0 0 3px rgba(76,141,255,.45);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    overflow-x:hidden;
    -webkit-user-select:none;
    user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  input,button{font-family:inherit;}
  .num, .tabular{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }

  button{ cursor:pointer; }
  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible{
    outline:none;
    box-shadow:var(--focus-ring);
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  .screen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    transition:transform .28s cubic-bezier(.4,0,.2,1), filter .28s;
  }
  #home{ z-index:1; }
  #groupScreen{
    z-index:2;
    transform:translateX(100%);
    background:var(--bg);
  }
  #detail{
    z-index:3;
    transform:translateX(100%);
    background:var(--bg);
  }
  body.group-open #groupScreen{ transform:translateX(0); }
  body.group-open #home{ transform:translateX(-6%); filter:brightness(.55); }
  body.detail-open #detail{ transform:translateX(0); }
  body.detail-open #home{ transform:translateX(-6%); filter:brightness(.55); }
  body.group-open.detail-open #groupScreen{ transform:translateX(-6%); filter:brightness(.55); }

  #orderScreen{
    z-index:2;
    transform:translateX(100%);
    background:var(--bg);
  }
  #historyScreen{
    z-index:3;
    transform:translateX(100%);
    background:var(--bg);
  }
  body.order-open #orderScreen{ transform:translateX(0); }
  body.order-open #home{ transform:translateX(-6%); filter:brightness(.55); }
  body.history-open #historyScreen{ transform:translateX(0); }
  body.history-open #orderScreen{ transform:translateX(-6%); filter:brightness(.55); }

  .group-detail-list{
    flex:1;
    overflow-y:auto;
    padding:var(--space-4);
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .home-top{
    padding:20px var(--space-4) var(--space-3);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .home-top-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:var(--space-4);
  }
  .home-top h1{
    margin:0;
    font-size:21px;
    font-weight:700;
    letter-spacing:.1px;
  }
  .home-top .subcount{
    color:var(--text-dim);
    font-size:13px;
    font-weight:500;
  }
  .search-row{
    display:flex;
    gap:var(--space-2);
  }
  .search-wrap{
    position:relative;
    flex:1;
  }
  .search-wrap svg{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-faint);
    pointer-events:none;
  }
  .search-input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius-s);
    padding:12px 42px 12px 14px;
    font-size:15px;
    outline:none;
    min-height:44px;
  }
  .search-input::placeholder{ color:var(--text-faint); }
  .add-btn{
    flex-shrink:0;
    width:46px;
    min-height:44px;
    background:var(--brand);
    border:none;
    border-radius:var(--radius-s);
    color:#fff;
    font-size:24px;
    font-weight:600;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .add-btn:active{ background:var(--brand-press); }

  .select-toggle-btn{
    flex-shrink:0;
    width:46px;
    min-height:44px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
  }
  .select-toggle-btn:active{ background:var(--surface-3); }
  body.select-mode .select-toggle-btn{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
  }

  .select-actionbar{
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex;
    gap:var(--space-2);
    padding:var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom));
    background:var(--surface);
    border-top:1px solid var(--line);
    transform:translateY(100%);
    transition:transform .22s;
    z-index:5;
  }
  body.select-mode .select-actionbar{ transform:translateY(0); }
  body.select-mode .list{ padding-bottom:96px; }

  .select-badge{
    display:none;
    flex-shrink:0;
    width:22px;height:22px;
    margin-top:2px;
    border-radius:50%;
    border:2px solid var(--line);
    background:var(--surface-2);
    color:#fff;
    font-size:12px;
    font-weight:700;
    align-items:center;
    justify-content:center;
  }
  body.select-mode .select-badge{ display:flex; }
  .group-card.selected{ border-color:var(--brand); background:rgba(76,141,255,.08); }
  .group-card.selected .select-badge{ background:var(--brand); border-color:var(--brand); }

  .filter-row{
    display:flex;
    gap:var(--space-2);
    margin-top:var(--space-3);
    overflow-x:auto;
    padding-bottom:2px;
  }
  .filter-chip{
    flex-shrink:0;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:7px 14px;
    min-height:34px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
  }
  .filter-chip.active{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
    font-weight:600;
  }

  .list{
    flex:1;
    overflow-y:auto;
    padding:var(--space-3) var(--space-4) var(--space-6);
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:var(--space-3);
  }
  .empty-state{
    width:100%;
    margin-top:60px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
  }

  .group-card{
    flex:1 1 100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-l);
    padding:var(--space-4);
    align-self:start;
  }
  @media (min-width:640px){
    .group-card{ flex-basis:calc(50% - var(--space-3)/2); }
  }
  @media (min-width:960px){
    .group-card{ flex-basis:calc(33.333% - var(--space-3)*2/3); }
  }
  .group-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:var(--space-2);
    margin-bottom:var(--space-3);
    width:100%;
    background:none;
    border:none;
    color:inherit;
    text-align:inherit;
    padding:0;
    font:inherit;
  }
  .group-head:active{ opacity:.75; }
  .group-name{
    font-size:15.5px;
    font-weight:700;
    line-height:1.35;
  }
  .group-cat{
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .group-total{
    text-align:left;
    flex-shrink:0;
  }
  .group-total .n{
    font-size:19px;
    font-weight:600;
  }
  .group-total .l{
    font-size:10.5px;
    color:var(--text-faint);
  }

  .variant-row{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .variant-chip{
    display:flex;
    align-items:center;
    gap:var(--space-3);
    background:var(--surface-2);
    border:1px solid var(--line-soft);
    border-radius:var(--radius-s);
    padding:9px 12px;
    min-height:44px;
    width:100%;
  }
  .variant-chip .size{
    font-size:13px;
    font-weight:700;
    width:22px;
    flex-shrink:0;
    color:var(--text-dim);
  }
  .variant-chip .healthbar{
    flex:1;
    height:6px;
    border-radius:999px;
    background:var(--surface-3);
    overflow:hidden;
  }
  .variant-chip .healthbar-fill{
    height:100%;
    border-radius:999px;
    transition:width .3s ease;
  }
  .variant-chip .qty{
    font-size:14.5px;
    font-weight:600;
    width:46px;
    text-align:left;
    flex-shrink:0;
    line-height:1.2;
  }
  .variant-chip .qty .pieces{
    display:block;
    font-size:10px;
    font-weight:500;
    color:var(--text-faint);
  }
  .variant-chip.status-good .qty{ color:var(--good); }
  .variant-chip.status-warn .qty{ color:var(--warn); }
  .variant-chip.status-bad .qty{ color:var(--bad); }
  .variant-chip.status-good .healthbar-fill{ background:var(--good); }
  .variant-chip.status-warn .healthbar-fill{ background:var(--warn); }
  .variant-chip.status-bad .healthbar-fill{ background:var(--bad); }

  .detail-header{
    display:flex;
    align-items:center;
    gap:var(--space-2);
    padding:16px var(--space-3);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .icon-btn{
    width:44px;height:44px;
    border-radius:var(--radius-s);
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .icon-btn:active{ background:var(--surface-2); }
  .detail-header-title{
    flex:1;
    min-width:0;
  }
  .detail-header-title .n{
    font-weight:700;
    font-size:15.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .detail-header-title .s{
    font-size:12px;
    color:var(--text-dim);
  }

  .qty-stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:var(--space-2);
    padding:10px var(--space-5);
  }
  .qty-label{
    color:var(--text-dim);
    font-size:14px;
    font-weight:500;
  }
  .qty-number{
    font-size:clamp(64px, 22vw, 100px);
    font-weight:700;
    line-height:1;
    transition:transform .12s;
  }
  .qty-number.bump{ transform:scale(1.07); }
  .qty-unit{ color:var(--text-dim); font-size:15px; }
  .qty-lowflag{
    margin-top:var(--space-2);
    background:var(--bad-bg);
    color:var(--bad);
    border:1px solid rgba(239,83,80,.35);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
  }
  .manual-edit-link{
    margin-top:var(--space-4);
    background:none;
    border:none;
    color:var(--brand);
    font-size:14px;
    font-weight:600;
    padding:10px 14px;
    min-height:44px;
    border-radius:var(--radius-s);
  }
  .manual-edit-link:active{ background:var(--surface-2); }

  .big-buttons{
    display:flex;
    flex-shrink:0;
    height:32dvh;
    min-height:200px;
  }
  .big-btn{
    flex:1;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:#fff;
    transition:filter .08s;
  }
  .big-btn .sym{ font-family:'IBM Plex Mono',monospace; font-size:52px; font-weight:700; line-height:1; }
  .big-btn .lbl{ font-size:14px; font-weight:600; opacity:.9; }
  .big-btn.minus{ background:var(--bad); border-radius:0 22px 0 0;}
  .big-btn.plus{ background:var(--good); border-radius:22px 0 0 0;}
  .big-btn.minus:active{ background:var(--bad-press); }
  .big-btn.plus:active{ background:#289b62; }

  .detail-footer{
    display:flex;
    gap:var(--space-2);
    padding:var(--space-3) var(--space-3) calc(var(--space-4) + env(safe-area-inset-bottom));
    flex-shrink:0;
    border-top:1px solid var(--line);
    background:var(--bg);
  }
  .ghost-btn{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:12px;
    min-height:44px;
    border-radius:var(--radius-s);
    font-size:14px;
    font-weight:600;
  }
  .ghost-btn:active{ background:var(--surface-2); }
  .ghost-btn.danger{ color:var(--bad); border-color:rgba(239,83,80,.3); }

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    z-index:10;
    display:flex;
    align-items:flex-end;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal-sheet{
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:var(--radius-l) var(--radius-l) 0 0;
    padding:20px var(--space-4) calc(20px + env(safe-area-inset-bottom));
    transform:translateY(16px);
    transition:transform .22s;
    max-height:85dvh;
    overflow-y:auto;
  }
  .modal-backdrop.open .modal-sheet{ transform:translateY(0); }
  .modal-title{
    font-size:16.5px;
    font-weight:700;
    margin:0 0 var(--space-4);
  }
  .field{ margin-bottom:var(--space-3); }
  .field label{
    display:block;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:6px;
    font-weight:500;
  }
  .field input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius-s);
    padding:12px 14px;
    min-height:44px;
    font-size:15px;
    outline:none;
  }
  .field input.big-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    font-weight:600;
    text-align:center;
  }
  .toggle-group{
    display:flex;
    gap:var(--space-2);
  }
  .toggle-btn{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:11px 8px;
    min-height:48px;
    border-radius:var(--radius-s);
    font-size:13px;
    font-weight:600;
    line-height:1.3;
  }
  .toggle-btn.active{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
  }
  .unit-conversion{
    color:var(--text-dim);
    font-size:13px;
    margin-top:2px;
  }
  .modal-actions{
    display:flex;
    gap:var(--space-2);
    margin-top:var(--space-4);
  }
  .btn-solid{
    flex:1;
    background:var(--brand);
    color:#fff;
    border:none;
    padding:14px;
    min-height:48px;
    border-radius:var(--radius-s);
    font-size:15px;
    font-weight:700;
  }
  .btn-solid:active{ background:var(--brand-press); }
  .btn-cancel{
    flex:1;
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--line);
    padding:14px;
    min-height:48px;
    border-radius:var(--radius-s);
    font-size:15px;
    font-weight:600;
  }

  .category-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.3px;
    margin:14px 2px 8px;
  }
  .category-label:first-child{ margin-top:2px; }

  .confirm-message{
    color:var(--text-dim);
    font-size:14.5px;
    line-height:1.6;
    white-space:pre-line;
  }
  .btn-solid.btn-danger{ background:var(--bad); }
  .btn-solid.btn-danger:active{ background:var(--bad-press); }

  .order-group-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    margin-bottom:8px;
    overflow:hidden;
  }
  .order-group-head{
    width:100%;
    display:flex;
    align-items:center;
    gap:var(--space-3);
    background:transparent;
    border:none;
    color:var(--text);
    padding:12px 14px;
    text-align:right;
    min-height:56px;
  }
  .order-group-head .n{ font-size:14.5px; font-weight:700; }
  .order-group-head .s{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .order-badge{
    background:var(--brand);
    color:#fff;
    font-size:12px;
    font-weight:700;
    min-width:22px;
    height:22px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    padding:0 6px;
    flex-shrink:0;
  }
  .chev{ flex-shrink:0; color:var(--text-faint); transition:transform .2s; }
  .chev.open{ transform:rotate(180deg); }
  .order-group-body{
    padding:0 12px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .order-group-body .order-row{ margin-bottom:0; }

  .order-stepper{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .stepper-btn{
    width:34px;height:34px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    font-size:18px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .stepper-btn:active{ background:var(--surface-3); }
  .stepper-btn.minus:active{ background:var(--bad); border-color:var(--bad); }
  .stepper-btn.plus:active{ background:var(--good); border-color:var(--good); }
  .stepper-val{
    min-width:26px;
    text-align:center;
    font-size:15px;
    font-weight:700;
  }

  .cart-fab{
    position:fixed;
    bottom:calc(22px + env(safe-area-inset-bottom));
    left:18px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--brand);
    border:none;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(0,0,0,.4);
    z-index:5;
  }
  .cart-fab:active{ background:var(--brand-press); }

  .order-row{
    display:flex;
    align-items:center;
    gap:var(--space-3);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:10px 12px;
    margin-bottom:8px;
  }
  .order-row .info{ flex:1; min-width:0; }
  .order-row .info .n{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .order-row .info .s{ font-size:11.5px; color:var(--text-dim); }
  .order-row .stock{ font-size:11px; color:var(--text-faint); flex-shrink:0; }
  .order-row input.order-qty{
    width:56px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius-s);
    padding:9px 6px;
    min-height:40px;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;

  .order-footer{
    display:flex;
    gap:var(--space-2);
    padding:var(--space-3) var(--space-3) calc(var(--space-4) + env(safe-area-inset-bottom));
    flex-shrink:0;
    border-top:1px solid var(--line);
    background:var(--bg);
  }

  .history-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:var(--space-3) var(--space-4);
    margin-bottom:var(--space-3);
  }
  .history-card .hdate{ font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .history-card .hitem{ display:flex; justify-content:space-between; font-size:14px; padding:3px 0; }
  .history-card .htotal{ margin-top:6px; padding-top:6px; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--text-dim); }

  .toast{
    position:fixed;
    bottom:calc(18px + env(safe-area-inset-bottom));
    left:50%;
    transform:translate(-50%,20px);
    background:var(--surface-3);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 20px;
    border-radius:999px;
    font-size:13.5px;
    z-index:20;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    white-space:nowrap;
    max-width:88vw;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SUPABASE_URL = 'https://xxiodivfhkukofsjtrcq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aW9kaXZmaGt1a29mc2p0cmNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDIzODEsImV4cCI6MjEwMzkxODM4MX0.C89zmJRgishZfVo6UAvNzO-uqD2ck8b21WakKpktt2I';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let currentProductId = null;
let activeCategory = 'الكل';
let selectMode = false;
let selectedGroups = new Set();
let lastGroupList = [];

const $ = id => document.getElementById(id);

function fromRow(r){
  return { id:r.id, name:r.name, sku:r.sku, category:r.category, qty:r.qty, min:r.min_qty, unit:r.unit, unitType:r.unit_type || 'single', oddLeftover:r.odd_leftover || 0 };
}

async function loadProducts(){
  const { data, error } = await sb.from('products').select('*').order('created_at', {ascending:true});
  if(error){ showToast('تعذر تحميل البيانات'); console.error(error); return; }
  products = data.map(fromRow);
  $('loadingState') && $('loadingState').remove();
  renderFilters();
  renderList();
}

sb.channel('products-changes')
  .on('postgres_changes', { event:'*', schema:'public', table:'products' }, ()=>{
    loadProducts().then(()=>{
      if(document.body.classList.contains('detail-open') && currentProductId){
        const p = products.find(x=>x.id===currentProductId);
        if(p) updateQtyDisplay(p, false);
      }
      if(document.body.classList.contains('group-open')){
        renderGroupScreen();
      }
    });
  })
  .subscribe();

const SIZE_TOKENS = ['XXL','XL','L','M','S','XS'];
function splitVariant(name){
  const parts = name.trim().split(/\s+/);
  const last = parts[parts.length-1].toUpperCase();
  if(SIZE_TOKENS.includes(last) && parts.length>1){
    return { base: parts.slice(0,-1).join(' '), size: last };
  }
  return { base: name, size: null };
}

function statusOf(p){
  if(p.qty <= 0) return 'bad';
  if(p.qty <= p.min) return 'warn';
  return 'good';
}

function categories(){
  const set = new Set(products.map(p=>p.category));
  return ['الكل', ...set];
}

function renderFilters(){
  const row = $('filterRow');
  row.innerHTML = '';
  categories().forEach(c=>{
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (c===activeCategory?' active':'');
    chip.textContent = c;
    chip.setAttribute('role','tab');
    chip.setAttribute('aria-selected', c===activeCategory ? 'true':'false');
    chip.onclick = ()=>{ activeCategory = c; renderFilters(); renderList(); };
    row.appendChild(chip);
  });
}

function renderList(){
  const q = $('search').value.trim().toLowerCase();
  const list = $('list');

  let items = products.filter(p=>{
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
    const matchC = activeCategory==='الكل' || p.category===activeCategory;
    return matchQ && matchC;
  });

  $('subcount').textContent = items.length ? `${items.length} منتج` : '';

  const groups = new Map();
  items.forEach(p=>{
    const { base, size } = splitVariant(p.name);
    const key = base + '||' + p.category;
    if(!groups.has(key)) groups.set(key, { base, category:p.category, key, variants:[] });
    groups.get(key).variants.push({ ...p, size: size || p.unit, label: size || p.unit });
  });

  const sizeOrder = s => { const i = SIZE_TOKENS.indexOf((s||'').toUpperCase()); return i===-1?99:(SIZE_TOKENS.length-i); };

  const groupList = Array.from(groups.values()).map(g=>{
    g.variants.sort((a,b)=> sizeOrder(b.size) - sizeOrder(a.size));
    const rankMap = {bad:0, warn:1, good:2};
    const worst = g.variants.reduce((acc,v)=>{
      const s = statusOf(v);
      return rankMap[s] < rankMap[acc] ? s : acc;
    }, 'good');
    g.worst = worst;
    g.total = g.variants.reduce((a,v)=>a+v.qty,0);
    return g;
  });

  const rankMap = {bad:0, warn:1, good:2};
  groupList.sort((a,b)=> rankMap[a.worst]-rankMap[b.worst]);

  lastGroupList = groupList;
  list.innerHTML = '';

  if(groupList.length===0){
    list.innerHTML = '<div class="empty-state">لا توجد منتجات مطابقة</div>';
    return;
  }

  groupList.forEach(g=>{
    const card = document.createElement('div');
    card.className = 'group-card' + (selectMode && selectedGroups.has(g.key) ? ' selected' : '');
    card.setAttribute('role','listitem');

    const head = document.createElement('button');
    head.className = 'group-head';
    head.type = 'button';
    head.setAttribute('aria-label', `فتح ${g.base} — كل المقاسات`);
    head.innerHTML = `
      <span class="select-badge">${selectedGroups.has(g.key) ? '✓' : ''}</span>
      <div style="flex:1">
        <div class="group-name">${escapeHtml(g.base)}</div>
        <div class="group-cat">${escapeHtml(g.category)}</div>
      </div>
      <div class="group-total">
        <div class="n num">${g.total}</div>
        <div class="l">إجمالي</div>
      </div>
    `;
    head.onclick = ()=>{
      if(selectMode){ toggleGroupSelect(g.key); return; }
      openGroupDetail(g.base, g.category);
    };
    card.appendChild(head);

    const rowWrap = document.createElement('div');
    rowWrap.className = 'variant-row';
    g.variants.forEach(v=>{
      const status = statusOf(v);
      const pct = v.min>0 ? Math.min(100, Math.round((v.qty / (v.min*2)) * 100)) : (v.qty>0?100:0);
      const chip = document.createElement('button');
      chip.className = `variant-chip status-${status}`;
      chip.setAttribute('aria-label', `${g.base} ${v.label}، الكمية ${v.qty}${v.unitType==='pair' ? '، ' + (v.qty*2) + ' قطعة فردية' : ''}`);
      chip.innerHTML = `
        <span class="size">${escapeHtml(v.label)}</span>
        <span class="healthbar"><span class="healthbar-fill" style="width:${pct}%"></span></span>
        <span class="qty num">${v.qty}${v.unitType==='pair' ? `<span class="pieces">${v.qty*2} قطعة${v.oddLeftover>0 ? ' +'+v.oddLeftover+' فردية' : ''}</span>` : ''}</span>
      `;
      chip.onclick = ()=>{
        if(selectMode){ toggleGroupSelect(g.key); return; }
        openDetail(v.id);
      };
      rowWrap.appendChild(chip);
    });
    card.appendChild(rowWrap);
    list.appendChild(card);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- bulk select + export ---------------- */
function toggleSelectMode(){
  selectMode = !selectMode;
  selectedGroups.clear();
  document.body.classList.toggle('select-mode', selectMode);
  updateSelectBar();
  renderList();
}

function toggleGroupSelect(key){
  if(selectedGroups.has(key)) selectedGroups.delete(key);
  else selectedGroups.add(key);
  updateSelectBar();
  renderList();
}

function selectAllVisible(){
  lastGroupList.forEach(g=>selectedGroups.add(g.key));
  updateSelectBar();
  renderList();
}

function updateSelectBar(){
  const btn = $('selectCount');
  if(!btn) return;
  btn.textContent = selectedGroups.size ? `نسخ (${selectedGroups.size} محدد)` : 'اختر منتجات';
}

async function exportSelectedToClipboard(){
  if(selectedGroups.size===0){ showToast('اختر منتج واحد على الأقل'); return; }

  const fmtQty = v => `${v.qty}${(v.unitType==='pair' && v.oddLeftover>0) ? ` (${v.oddLeftover} قطعة فردية)` : ''}`;

  const selected = lastGroupList.filter(g=>selectedGroups.has(g.key));
  const lines = [];
  selected.forEach(g=>{
    const isSingle = g.variants.length===1 && !g.variants[0].size;
    if(isSingle){
      lines.push(`${g.base}: ${fmtQty(g.variants[0])}`);
    } else {
      lines.push(g.base);
      g.variants.forEach(v=>{
        lines.push(`    ${v.label}: ${fmtQty(v)}`);
      });
    }
    lines.push('');
  });
  const text = lines.join('\n').trim();

  try{
    await navigator.clipboard.writeText(text);
    showToast(`تم نسخ ${selected.length} منتج للحافظة`);
  }catch(e){
    showToast('تعذر النسخ — تأكد من صلاحيات المتصفح');
  }
  toggleSelectMode();
}

$('search').addEventListener('input', renderList);

function openDetail(id){
  currentProductId = id;
  const p = products.find(x=>x.id===id);
  if(!p) return;
  $('dName').textContent = p.name;
  $('dSku').textContent = p.sku;
  $('dUnit').textContent = p.unit;
  updateQtyDisplay(p, false);
  document.body.classList.add('detail-open');
  $('detail').querySelector('.icon-btn').focus();
}

function closeDetail(){
  document.body.classList.remove('detail-open');
  if(document.body.classList.contains('group-open')){
    renderGroupScreen();
  } else {
    renderFilters();
    renderList();
  }
}

/* ---------------- group (whole-product) screen ---------------- */
let currentGroupBase = null;
let currentGroupCategory = null;

function openGroupDetail(base, category){
  currentGroupBase = base;
  currentGroupCategory = category;
  renderGroupScreen();
  document.body.classList.add('group-open');
  $('groupScreen').querySelector('.icon-btn').focus();
}

function closeGroupDetail(){
  document.body.classList.remove('group-open');
  currentGroupBase = null;
  currentGroupCategory = null;
  renderFilters();
  renderList();
}

function renderGroupScreen(){
  if(currentGroupBase===null) return;
  const variants = products
    .filter(p=>{
      const { base } = splitVariant(p.name);
      return base===currentGroupBase && p.category===currentGroupCategory;
    })
    .map(p=>{
      const { size } = splitVariant(p.name);
      return { ...p, label: size || p.unit, size };
    });

  const sizeOrder = s => { const i = SIZE_TOKENS.indexOf((s||'').toUpperCase()); return i===-1?99:(SIZE_TOKENS.length-i); };
  variants.sort((a,b)=> sizeOrder(b.size) - sizeOrder(a.size));

  const total = variants.reduce((a,v)=>a+v.qty,0);

  $('gName').textContent = currentGroupBase;
  $('gCat').textContent = currentGroupCategory;
  $('gTotal').textContent = total;

  const wrap = $('groupList');
  wrap.innerHTML = '';
  if(variants.length===0){
    wrap.innerHTML = '<div class="empty-state">تم حذف هذا المنتج</div>';
    return;
  }
  variants.forEach(v=>{
    const status = statusOf(v);
    const pct = v.min>0 ? Math.min(100, Math.round((v.qty / (v.min*2)) * 100)) : (v.qty>0?100:0);
    const chip = document.createElement('button');
    chip.className = `variant-chip status-${status}`;
    chip.setAttribute('aria-label', `${currentGroupBase} ${v.label}، الكمية ${v.qty}${v.unitType==='pair' ? '، ' + (v.qty*2) + ' قطعة فردية' : ''}`);
    chip.innerHTML = `
      <span class="size">${escapeHtml(v.label)}</span>
      <span class="healthbar"><span class="healthbar-fill" style="width:${pct}%"></span></span>
      <span class="qty num">${v.qty}${v.unitType==='pair' ? `<span class="pieces">${v.qty*2} قطعة${v.oddLeftover>0 ? ' +'+v.oddLeftover+' فردية' : ''}</span>` : ''}</span>
    `;
    chip.onclick = ()=>openDetail(v.id);
    wrap.appendChild(chip);
  });
}

function updateQtyDisplay(p, animate){
  const el = $('dQty');
  el.textContent = p.qty;
  $('dLowFlag').style.display = (p.qty <= p.min) ? 'block' : 'none';
  const conv = $('dUnitConversion');
  if(p.unitType === 'pair'){
    let txt = `= ${p.qty * 2} قطعة فردية (زوج، كل قطعتين = حبة)`;
    if(p.oddLeftover > 0) txt += ` + ${p.oddLeftover} قطعة فردية بدون زوج`;
    conv.textContent = txt;
    conv.style.display = 'block';
  } else {
    conv.style.display = 'none';
  }
  if(animate){
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
}

async function bump(delta){
  const p = products.find(x=>x.id===currentProductId);
  if(!p) return;
  const prevQty = p.qty;
  const newQty = Math.max(0, p.qty + delta);
  p.qty = newQty;
  updateQtyDisplay(p, true);
  if(navigator.vibrate) navigator.vibrate(delta>0?15:[10,30,10]);

  const { error } = await sb.from('products').update({ qty:newQty }).eq('id', currentProductId);
  if(error){ p.qty = prevQty; updateQtyDisplay(p, false); showToast('فشل الحفظ، حاول مجدداً'); return; }
  sb.from('stock_movements').insert({
    product_id:currentProductId, change_amount:delta, previous_qty:prevQty, new_qty:newQty,
    movement_type: delta>0 ? 'increment' : 'decrement'
  }).then(()=>{});
}

async function deleteProduct(){
  const p = products.find(x=>x.id===currentProductId);
  if(!p) return;
  if(!(await customConfirm(`حذف "${p.name}"؟ لا يمكن التراجع عن هذا.`, {title:'حذف المنتج', okText:'حذف', danger:true}))) return;
  const { error } = await sb.from('products').delete().eq('id', currentProductId);
  if(error){ showToast('تعذر حذف المنتج'); return; }
  products = products.filter(x=>x.id!==currentProductId);
  closeDetail();
  showToast('تم حذف المنتج');
}

function openManualQtyModal(){
  const p = products.find(x=>x.id===currentProductId);
  $('manualQtyInput').value = p.qty;
  if(p.unitType === 'pair'){
    $('manualOddLeftoverField').style.display = 'block';
    $('manualOddLeftoverInput').value = p.oddLeftover || 0;
  } else {
    $('manualOddLeftoverField').style.display = 'none';
  }
  openModal('modalManualQty');
  setTimeout(()=>$('manualQtyInput').focus(), 250);
}
async function saveManualQty(){
  const p = products.find(x=>x.id===currentProductId);
  const v = parseInt($('manualQtyInput').value, 10);
  if(isNaN(v) || v < 0){ showToast('أدخل رقماً صحيحاً'); return; }
  const odd = p.unitType==='pair' ? Math.max(0, parseInt($('manualOddLeftoverInput').value,10) || 0) : p.oddLeftover;
  const prevQty = p.qty;
  const { error } = await sb.from('products').update({ qty:v, odd_leftover:odd }).eq('id', currentProductId);
  if(error){ showToast('تعذر الحفظ'); return; }
  sb.from('stock_movements').insert({
    product_id:currentProductId, change_amount:v-prevQty, previous_qty:prevQty, new_qty:v,
    movement_type:'manual_correction'
  }).then(()=>{});
  p.qty = v;
  p.oddLeftover = odd;
  updateQtyDisplay(p, true);
  closeModal('modalManualQty');
  showToast('تم تحديث الكمية');
}

let selectedUnitType = 'single';
function setUnitType(v){
  selectedUnitType = v;
  document.querySelectorAll('#pfUnitTypeGroup .toggle-btn').forEach(btn=>{
    const on = btn.dataset.value === v;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-checked', on ? 'true':'false');
  });
  $('pfOddLeftoverField').style.display = (v==='pair') ? 'block' : 'none';
}

function openAddModal(){
  currentProductId = null;
  $('productModalTitle').textContent = 'إضافة منتج جديد';
  ['pfName','pfSku','pfCategory','pfQty','pfMin','pfUnit','pfOddLeftover'].forEach(id=>$(id).value='');
  $('pfUnit').value = 'قطعة';
  $('pfMin').value = '5';
  setUnitType('single');
  openModal('modalProduct');
}

function openEditModal(){
  const p = products.find(x=>x.id===currentProductId);
  if(!p) return;
  $('productModalTitle').textContent = 'تعديل بيانات المنتج';
  $('pfName').value = p.name;
  $('pfSku').value = p.sku;
  $('pfCategory').value = p.category;
  $('pfQty').value = p.qty;
  $('pfMin').value = p.min;
  $('pfUnit').value = p.unit;
  $('pfOddLeftover').value = p.oddLeftover || 0;
  setUnitType(p.unitType || 'single');
  openModal('modalProduct');
}

async function saveProductForm(){
  const name = $('pfName').value.trim();
  const sku = $('pfSku').value.trim();
  if(!name || !sku){ showToast('الاسم والكود مطلوبان'); return; }

  const dupe = products.find(p=>p.sku===sku && p.id!==currentProductId);
  if(dupe){ showToast('هذا الكود مستخدم بالفعل'); return; }

  const data = {
    name,
    sku,
    category: $('pfCategory').value.trim() || 'عام',
    qty: Math.max(0, parseInt($('pfQty').value,10) || 0),
    min_qty: Math.max(0, parseInt($('pfMin').value,10) || 0),
    unit: $('pfUnit').value.trim() || 'قطعة',
    unit_type: selectedUnitType,
    odd_leftover: selectedUnitType==='pair' ? Math.max(0, parseInt($('pfOddLeftover').value,10) || 0) : 0,
  };

  if(currentProductId===null){
    const { data:inserted, error } = await sb.from('products').insert(data).select().single();
    if(error){ showToast('تعذر إضافة المنتج'); console.error(error); return; }
    products.push(fromRow(inserted));
    closeModal('modalProduct');
    renderFilters(); renderList();
    showToast('تمت إضافة المنتج');
  } else {
    const { error } = await sb.from('products').update(data).eq('id', currentProductId);
    if(error){ showToast('تعذر حفظ التعديلات'); console.error(error); return; }
    const p = products.find(x=>x.id===currentProductId);
    Object.assign(p, {name:data.name, sku:data.sku, category:data.category, qty:data.qty, min:data.min_qty, unit:data.unit, unitType:data.unit_type, oddLeftover:data.odd_leftover});
    closeModal('modalProduct');
    $('dName').textContent = p.name;
    $('dSku').textContent = p.sku;
    $('dUnit').textContent = p.unit;
    updateQtyDisplay(p, false);
    showToast('تم حفظ التعديلات');
  }
}

function openModal(id){ $(id).classList.add('open'); }
function closeModal(id){ $(id).classList.remove('open'); }

let _confirmResolve = null;
function customConfirm(message, opts={}){
  return new Promise(resolve=>{
    _confirmResolve = resolve;
    $('confirmTitle').textContent = opts.title || 'تأكيد';
    $('confirmMessage').textContent = message;
    $('confirmOkBtn').textContent = opts.okText || 'تأكيد';
    $('confirmCancelBtn').textContent = opts.cancelText || 'إلغاء';
    $('confirmOkBtn').className = 'btn-solid' + (opts.danger ? ' btn-danger' : '');
    openModal('modalConfirm');
  });
}
function resolveConfirm(val){
  closeModal('modalConfirm');
  if(_confirmResolve){ _confirmResolve(val); _confirmResolve = null; }
}

document.querySelectorAll('.modal-backdrop').forEach(m=>{
  m.addEventListener('click', e=>{
    if(e.target!==m) return;
    if(m.id==='modalConfirm') resolveConfirm(false);
    else closeModal(m.id);
  });
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(document.getElementById('modalConfirm').classList.contains('open')){ resolveConfirm(false); return; }
    document.querySelectorAll('.modal-backdrop.open').forEach(m=>closeModal(m.id));
    if(document.body.classList.contains('detail-open')) closeDetail();
    else if(document.body.classList.contains('group-open')) closeGroupDetail();
  }
});

let toastTimer;
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------------- order builder (basket) ---------------- */
let orderCart = new Map(); // product id -> qty
let expandedOrderGroups = new Set();
let orderActiveCategory = 'الكل';

function openOrderScreen(){
  orderCart.clear();
  expandedOrderGroups.clear();
  orderActiveCategory = 'الكل';
  $('orderSearch').value = '';
  renderOrderFilters();
  renderOrderList();
  updateOrderFooter();
  document.body.classList.add('order-open');
}
function closeOrderScreen(){
  document.body.classList.remove('order-open', 'history-open');
}

function setOrderQty(id, qty){
  qty = Math.max(0, qty);
  if(qty > 0) orderCart.set(id, qty); else orderCart.delete(id);
  renderOrderList();
  updateOrderFooter();
}

function renderOrderFilters(){
  const row = $('orderFilterRow');
  row.innerHTML = '';
  const cats = ['الكل', ...new Set(products.map(p=>p.category))];
  cats.forEach(c=>{
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (c===orderActiveCategory?' active':'');
    chip.textContent = c;
    chip.setAttribute('role','tab');
    chip.setAttribute('aria-selected', c===orderActiveCategory ? 'true':'false');
    chip.onclick = ()=>{ orderActiveCategory = c; renderOrderFilters(); renderOrderList(); };
    row.appendChild(chip);
  });
}

function renderOrderList(){
  const q = $('orderSearch').value.trim().toLowerCase();
  const list = $('orderList');
  const items = products.filter(p=>{
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
    const matchC = orderActiveCategory==='الكل' || p.category===orderActiveCategory;
    return matchQ && matchC;
  });

  const groups = new Map();
  items.forEach(p=>{
    const { base, size } = splitVariant(p.name);
    const key = base + '||' + p.category;
    if(!groups.has(key)) groups.set(key, { base, category:p.category, key, variants:[] });
    groups.get(key).variants.push({ ...p, size, label: size || p.unit });
  });

  const sizeOrder = s => { const i = SIZE_TOKENS.indexOf((s||'').toUpperCase()); return i===-1?99:(SIZE_TOKENS.length-i); };
  const groupList = Array.from(groups.values());
  groupList.forEach(g=> g.variants.sort((a,b)=> sizeOrder(b.size) - sizeOrder(a.size)));
  groupList.sort((a,b)=> a.category.localeCompare(b.category,'ar') || a.base.localeCompare(b.base, 'ar'));

  list.innerHTML = '';
  if(groupList.length===0){
    list.innerHTML = '<div class="empty-state">لا توجد منتجات مطابقة</div>';
    return;
  }

  function buildStepper(v){
    const val = orderCart.get(v.id) || 0;
    const stepper = document.createElement('div');
    stepper.className = 'order-stepper';
    stepper.innerHTML = `
      <button type="button" class="stepper-btn minus" aria-label="إنقاص">−</button>
      <span class="stepper-val num">${val}</span>
      <button type="button" class="stepper-btn plus" aria-label="زيادة">+</button>
    `;
    stepper.querySelector('.minus').onclick = ()=> setOrderQty(v.id, (orderCart.get(v.id)||0) - 1);
    stepper.querySelector('.plus').onclick = ()=> setOrderQty(v.id, (orderCart.get(v.id)||0) + 1);
    return stepper;
  }

  let lastCategory = null;
  groupList.forEach(g=>{
    if(g.category !== lastCategory){
      lastCategory = g.category;
      const label = document.createElement('div');
      label.className = 'category-label';
      label.textContent = g.category;
      list.appendChild(label);
    }

    if(g.variants.length === 1){
      const v = g.variants[0];
      const row = document.createElement('div');
      const val = orderCart.get(v.id) || 0;
      row.className = 'order-row' + (val>0 ? ' has-qty' : '');
      row.innerHTML = `
        <div class="info">
          <div class="n">${escapeHtml(g.base)}</div>
          <div class="s num">${escapeHtml(v.sku)} — المخزون: ${v.qty}</div>
        </div>
      `;
      row.appendChild(buildStepper(v));
      list.appendChild(row);
      return;
    }

    const expanded = expandedOrderGroups.has(g.key);
    const groupOrderQty = g.variants.reduce((sum,v)=> sum + (orderCart.get(v.id)||0), 0);

    const card = document.createElement('div');
    card.className = 'order-group-card';

    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'order-group-head';
    head.innerHTML = `
      <div style="flex:1">
        <div class="n">${escapeHtml(g.base)}</div>
        <div class="s">${escapeHtml(g.category)}</div>
      </div>
      ${groupOrderQty>0 ? `<span class="order-badge">${groupOrderQty}</span>` : ''}
      <svg class="chev ${expanded?'open':''}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    `;
    head.setAttribute('aria-expanded', expanded ? 'true':'false');
    head.onclick = ()=>{
      if(expandedOrderGroups.has(g.key)) expandedOrderGroups.delete(g.key);
      else expandedOrderGroups.add(g.key);
      renderOrderList();
    };
    card.appendChild(head);

    if(expanded){
      const body = document.createElement('div');
      body.className = 'order-group-body';
      g.variants.forEach(v=>{
        const row = document.createElement('div');
        const val = orderCart.get(v.id) || 0;
        row.className = 'order-row' + (val>0 ? ' has-qty' : '');
        row.innerHTML = `
          <div class="info">
            <div class="n">${escapeHtml(v.label)}</div>
            <div class="s num">${escapeHtml(v.sku)} — المخزون: ${v.qty}</div>
          </div>
        `;
        row.appendChild(buildStepper(v));
        body.appendChild(row);
      });
      card.appendChild(body);
    }
    list.appendChild(card);
  });
}
$('orderSearch').addEventListener('input', renderOrderList);

function updateOrderFooter(){
  const count = orderCart.size;
  const btn = $('submitOrderBtn');
  btn.textContent = count ? `إرسال الطلب (${count} منتج)` : 'إرسال الطلب';
  $('orderSubcount').textContent = count ? `${count} منتج مضاف` : 'أضف الكميات المرسلة';
}

async function submitOrder(){
  if(orderCart.size===0){ showToast('أضف كمية لمنتج واحد على الأقل'); return; }

  const entries = Array.from(orderCart.entries()).map(([id, qty])=>{
    const p = products.find(x=>x.id===id);
    return { p, qty };
  }).filter(e=>e.p);

  const overStock = entries.filter(e=>e.qty > e.p.qty);
  if(overStock.length>0){
    const names = overStock.map(e=>e.p.name).join('، ');
    if(!(await customConfirm(`الكمية المطلوبة أكبر من المخزون المتاح لـ: ${names}\nهل تكمل على أي حال؟ (سينزل المخزون لصفر)`, {title:'تنبيه المخزون', okText:'أكمل على أي حال', danger:true}))) return;
  }

  if(!(await customConfirm(`تأكيد إرسال الطلب وخصم ${entries.length} منتج من المخزون؟`, {title:'إرسال الطلب', okText:'إرسال'}))) return;

  const items = [];
  let totalQty = 0;

  for(const {p, qty} of entries){
    const newQty = Math.max(0, p.qty - qty);
    const { error } = await sb.from('products').update({ qty:newQty }).eq('id', p.id);
    if(error){ showToast(`تعذر تحديث ${p.name}`); continue; }
    sb.from('stock_movements').insert({
      product_id:p.id, change_amount:-qty, previous_qty:p.qty, new_qty:newQty,
      movement_type:'order_shipped'
    }).then(()=>{});
    p.qty = newQty;
    items.push({ name:p.name, sku:p.sku, qty });
    totalQty += qty;
  }

  const { error: orderErr } = await sb.from('orders').insert({ items, total_qty: totalQty });
  if(orderErr){ showToast('تم خصم المخزون لكن تعذر حفظ السجل'); console.error(orderErr); }
  else showToast('تم إرسال الطلب وتحديث المخزون');

  orderCart.clear();
  renderList();
  closeOrderScreen();
}

/* ---------------- order history ---------------- */
async function openHistoryScreen(){
  document.body.classList.add('history-open');
  const list = $('historyList');
  list.innerHTML = '<div class="empty-state">جارِ التحميل...</div>';

  const { data, error } = await sb.from('orders').select('*').order('created_at', {ascending:false}).limit(50);
  if(error){ list.innerHTML = '<div class="empty-state">تعذر تحميل السجل</div>'; return; }
  if(!data || data.length===0){ list.innerHTML = '<div class="empty-state">لا توجد طلبات مرسلة بعد</div>'; return; }

  list.innerHTML = '';
  data.forEach(order=>{
    const card = document.createElement('div');
    card.className = 'history-card';
    const date = new Date(order.created_at);
    const dateStr = date.toLocaleString('ar-SA', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const itemsHtml = (order.items || []).map(it=>
      `<div class="hitem"><span>${escapeHtml(it.name)}</span><span class="num">${it.qty}</span></div>`
    ).join('');
    card.innerHTML = `
      <div class="hdate">${dateStr}</div>
      ${itemsHtml}
      <div class="htotal">الإجمالي: ${order.total_qty} قطعة</div>
    `;
    list.appendChild(card);
  });
}
function closeHistoryScreen(){
  document.body.classList.remove('history-open');
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(document.body.classList.contains('history-open')) closeHistoryScreen();
    else if(document.body.classList.contains('order-open')) closeOrderScreen();
  }
});

loadProducts();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
