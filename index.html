<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إدارة المخزون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============================================================
     نظام التصميم — لغة "صناعية موثوقة" لأداة تشغيلية يومية
     العلامة: أزرق إشارة. الحالة: أخضر/كهرماني/أحمر (محجوزة للمخزون فقط)
     ============================================================ */
  :root{
    --bg:#0e1013;
    --surface:#16191d;
    --surface-2:#1e2227;
    --surface-3:#262b31;
    --line:#2a2f36;
    --line-soft:#20242a;
    --text:#eef0f2;
    --text-dim:#8b929b;
    --text-faint:#5c636b;

    --brand:#4c8dff;
    --brand-press:#3a74e0;

    --good:#33c17a;
    --warn:#e0a531;
    --bad:#ef5350;
    --bad-bg:rgba(239,83,80,.14);
    --bad-press:#d0413e;

    --radius-s:10px;
    --radius-m:14px;
    --radius-l:20px;

    --space-2:8px;
    --space-3:12px;
    --space-4:16px;
    --space-5:24px;
    --space-6:32px;

    --focus-ring: 0 0 0 3px rgba(76,141,255,.45);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    overflow-x:hidden;
    -webkit-user-select:none;
    user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  input,button{font-family:inherit;}
  .num, .tabular{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }

  button{ cursor:pointer; }
  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible{
    outline:none;
    box-shadow:var(--focus-ring);
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  .screen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    transition:transform .28s cubic-bezier(.4,0,.2,1), filter .28s;
  }
  #home{ z-index:1; }
  #detail{
    z-index:2;
    transform:translateX(100%);
    background:var(--bg);
  }
  body.detail-open #detail{ transform:translateX(0); }
  body.detail-open #home{ transform:translateX(-6%); filter:brightness(.55); }

  .home-top{
    padding:20px var(--space-4) var(--space-3);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .home-top-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:var(--space-4);
  }
  .home-top h1{
    margin:0;
    font-size:21px;
    font-weight:700;
    letter-spacing:.1px;
  }
  .home-top .subcount{
    color:var(--text-dim);
    font-size:13px;
    font-weight:500;
  }
  .search-row{
    display:flex;
    gap:var(--space-2);
  }
  .search-wrap{
    position:relative;
    flex:1;
  }
  .search-wrap svg{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-faint);
    pointer-events:none;
  }
  #search{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius-s);
    padding:12px 42px 12px 14px;
    font-size:15px;
    outline:none;
    min-height:44px;
  }
  #search::placeholder{ color:var(--text-faint); }
  .add-btn{
    flex-shrink:0;
    width:46px;
    min-height:44px;
    background:var(--brand);
    border:none;
    border-radius:var(--radius-s);
    color:#fff;
    font-size:24px;
    font-weight:600;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .add-btn:active{ background:var(--brand-press); }

  .filter-row{
    display:flex;
    gap:var(--space-2);
    margin-top:var(--space-3);
    overflow-x:auto;
    padding-bottom:2px;
  }
  .filter-chip{
    flex-shrink:0;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:7px 14px;
    min-height:34px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
  }
  .filter-chip.active{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
    font-weight:600;
  }

  .list{
    flex:1;
    overflow-y:auto;
    padding:var(--space-3) var(--space-4) var(--space-6);
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:var(--space-3);
  }
  .empty-state{
    width:100%;
    margin-top:60px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
  }

  .group-card{
    flex:1 1 100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-l);
    padding:var(--space-4);
    align-self:start;
  }
  @media (min-width:640px){
    .group-card{ flex-basis:calc(50% - var(--space-3)/2); }
  }
  @media (min-width:960px){
    .group-card{ flex-basis:calc(33.333% - var(--space-3)*2/3); }
  }
  .group-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:var(--space-2);
    margin-bottom:var(--space-3);
  }
  .group-name{
    font-size:15.5px;
    font-weight:700;
    line-height:1.35;
  }
  .group-cat{
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .group-total{
    text-align:left;
    flex-shrink:0;
  }
  .group-total .n{
    font-size:19px;
    font-weight:600;
  }
  .group-total .l{
    font-size:10.5px;
    color:var(--text-faint);
  }

  .variant-row{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .variant-chip{
    display:flex;
    align-items:center;
    gap:var(--space-3);
    background:var(--surface-2);
    border:1px solid var(--line-soft);
    border-radius:var(--radius-s);
    padding:9px 12px;
    min-height:44px;
    width:100%;
  }
  .variant-chip .size{
    font-size:13px;
    font-weight:700;
    width:22px;
    flex-shrink:0;
    color:var(--text-dim);
  }
  .variant-chip .healthbar{
    flex:1;
    height:6px;
    border-radius:999px;
    background:var(--surface-3);
    overflow:hidden;
  }
  .variant-chip .healthbar-fill{
    height:100%;
    border-radius:999px;
    transition:width .3s ease;
  }
  .variant-chip .qty{
    font-size:14.5px;
    font-weight:600;
    width:30px;
    text-align:left;
    flex-shrink:0;
  }
  .variant-chip.status-good .qty{ color:var(--good); }
  .variant-chip.status-warn .qty{ color:var(--warn); }
  .variant-chip.status-bad .qty{ color:var(--bad); }
  .variant-chip.status-good .healthbar-fill{ background:var(--good); }
  .variant-chip.status-warn .healthbar-fill{ background:var(--warn); }
  .variant-chip.status-bad .healthbar-fill{ background:var(--bad); }

  .detail-header{
    display:flex;
    align-items:center;
    gap:var(--space-2);
    padding:16px var(--space-3);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .icon-btn{
    width:44px;height:44px;
    border-radius:var(--radius-s);
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .icon-btn:active{ background:var(--surface-2); }
  .detail-header-title{
    flex:1;
    min-width:0;
  }
  .detail-header-title .n{
    font-weight:700;
    font-size:15.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .detail-header-title .s{
    font-size:12px;
    color:var(--text-dim);
  }

  .qty-stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:var(--space-2);
    padding:10px var(--space-5);
  }
  .qty-label{
    color:var(--text-dim);
    font-size:14px;
    font-weight:500;
  }
  .qty-number{
    font-size:clamp(64px, 22vw, 100px);
    font-weight:700;
    line-height:1;
    transition:transform .12s;
  }
  .qty-number.bump{ transform:scale(1.07); }
  .qty-unit{ color:var(--text-dim); font-size:15px; }
  .qty-lowflag{
    margin-top:var(--space-2);
    background:var(--bad-bg);
    color:var(--bad);
    border:1px solid rgba(239,83,80,.35);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
  }
  .manual-edit-link{
    margin-top:var(--space-4);
    background:none;
    border:none;
    color:var(--brand);
    font-size:14px;
    font-weight:600;
    padding:10px 14px;
    min-height:44px;
    border-radius:var(--radius-s);
  }
  .manual-edit-link:active{ background:var(--surface-2); }

  .big-buttons{
    display:flex;
    flex-shrink:0;
    height:32dvh;
    min-height:200px;
  }
  .big-btn{
    flex:1;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:#fff;
    transition:filter .08s;
  }
  .big-btn .sym{ font-family:'IBM Plex Mono',monospace; font-size:52px; font-weight:700; line-height:1; }
  .big-btn .lbl{ font-size:14px; font-weight:600; opacity:.9; }
  .big-btn.minus{ background:var(--bad); border-radius:0 22px 0 0;}
  .big-btn.plus{ background:var(--good); border-radius:22px 0 0 0;}
  .big-btn.minus:active{ background:var(--bad-press); }
  .big-btn.plus:active{ background:#289b62; }

  .detail-footer{
    display:flex;
    gap:var(--space-2);
    padding:var(--space-3) var(--space-3) calc(var(--space-4) + env(safe-area-inset-bottom));
    flex-shrink:0;
    border-top:1px solid var(--line);
    background:var(--bg);
  }
  .ghost-btn{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:12px;
    min-height:44px;
    border-radius:var(--radius-s);
    font-size:14px;
    font-weight:600;
  }
  .ghost-btn:active{ background:var(--surface-2); }
  .ghost-btn.danger{ color:var(--bad); border-color:rgba(239,83,80,.3); }

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    z-index:10;
    display:flex;
    align-items:flex-end;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal-sheet{
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:var(--radius-l) var(--radius-l) 0 0;
    padding:20px var(--space-4) calc(20px + env(safe-area-inset-bottom));
    transform:translateY(16px);
    transition:transform .22s;
    max-height:85dvh;
    overflow-y:auto;
  }
  .modal-backdrop.open .modal-sheet{ transform:translateY(0); }
  .modal-title{
    font-size:16.5px;
    font-weight:700;
    margin:0 0 var(--space-4);
  }
  .field{ margin-bottom:var(--space-3); }
  .field label{
    display:block;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:6px;
    font-weight:500;
  }
  .field input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius-s);
    padding:12px 14px;
    min-height:44px;
    font-size:15px;
    outline:none;
  }
  .field input.big-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    font-weight:600;
    text-align:center;
  }
  .modal-actions{
    display:flex;
    gap:var(--space-2);
    margin-top:var(--space-4);
  }
  .btn-solid{
    flex:1;
    background:var(--brand);
    color:#fff;
    border:none;
    padding:14px;
    min-height:48px;
    border-radius:var(--radius-s);
    font-size:15px;
    font-weight:700;
  }
  .btn-solid:active{ background:var(--brand-press); }
  .btn-cancel{
    flex:1;
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--line);
    padding:14px;
    min-height:48px;
    border-radius:var(--radius-s);
    font-size:15px;
    font-weight:600;
  }

  .toast{
    position:fixed;
    bottom:calc(18px + env(safe-area-inset-bottom));
    left:50%;
    transform:translate(-50%,20px);
    background:var(--surface-3);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 20px;
    border-radius:999px;
    font-size:13.5px;
    z-index:20;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    white-space:nowrap;
    max-width:88vw;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div class="screen" id="home">
  <div class="home-top">
    <div class="home-top-row">
      <h1>المخزون</h1>
      <span class="subcount" id="subcount" aria-live="polite"></span>
    </div>
    <div class="search-row">
      <div class="search-wrap">
        <input id="search" placeholder="ابحث بالاسم أو الكود..." aria-label="بحث في المنتجات">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <button class="add-btn" onclick="openAddModal()" aria-label="إضافة منتج جديد">+</button>
    </div>
    <div class="filter-row" id="filterRow" role="tablist" aria-label="تصفية حسب التصنيف"></div>
  </div>
  <div class="list" id="list" role="list">
    <div class="empty-state" id="loadingState">جارِ التحميل...</div>
  </div>
</div>

<div class="screen" id="detail" role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="detail-header">
    <button class="icon-btn" onclick="closeDetail()" aria-label="رجوع للقائمة">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <div class="detail-header-title">
      <div class="n" id="dName">—</div>
      <div class="s num" id="dSku">—</div>
    </div>
    <button class="icon-btn" onclick="openEditModal()" aria-label="تعديل بيانات المنتج">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </div>

  <div class="qty-stage">
    <div class="qty-label">الكمية الحالية</div>
    <div class="qty-number num" id="dQty" aria-live="polite">0</div>
    <div class="qty-unit" id="dUnit">قطعة</div>
    <div class="qty-lowflag" id="dLowFlag" style="display:none" role="status">الكمية أقل من الحد الأدنى</div>
    <button class="manual-edit-link" onclick="openManualQtyModal()">تعديل الكمية يدوياً (شحنة جديدة)</button>
  </div>

  <div class="big-buttons">
    <button class="big-btn plus" onclick="bump(1)" aria-label="زيادة الكمية بمقدار واحد">
      <span class="sym" aria-hidden="true">+1</span>
      <span class="lbl">إضافة</span>
    </button>
    <button class="big-btn minus" onclick="bump(-1)" aria-label="إنقاص الكمية بمقدار واحد">
      <span class="sym" aria-hidden="true">−1</span>
      <span class="lbl">خصم / بيع</span>
    </button>
  </div>

  <div class="detail-footer">
    <button class="ghost-btn" onclick="openEditModal()">تعديل بيانات المنتج</button>
    <button class="ghost-btn danger" onclick="deleteProduct()">حذف المنتج</button>
  </div>
</div>

<div class="modal-backdrop" id="modalManualQty" role="dialog" aria-modal="true" aria-labelledby="manualQtyTitle">
  <div class="modal-sheet">
    <div class="modal-title" id="manualQtyTitle">تعديل الكمية يدوياً</div>
    <div class="field">
      <label for="manualQtyInput">الكمية الجديدة</label>
      <input type="number" inputmode="numeric" class="big-num" id="manualQtyInput">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalManualQty')">إلغاء</button>
      <button class="btn-solid" onclick="saveManualQty()">حفظ</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalProduct" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
  <div class="modal-sheet">
    <div class="modal-title" id="productModalTitle">إضافة منتج جديد</div>
    <div class="field">
      <label for="pfName">اسم المنتج</label>
      <input type="text" id="pfName" placeholder="مثال: سترابس 8 بني L">
    </div>
    <div class="field">
      <label for="pfSku">الكود / SKU</label>
      <input type="text" id="pfSku" placeholder="مثال: STRAP8-BRN-L">
    </div>
    <div class="field">
      <label for="pfCategory">التصنيف</label>
      <input type="text" id="pfCategory" placeholder="مثال: سترابس">
    </div>
    <div class="field">
      <label for="pfQty">الكمية الحالية</label>
      <input type="number" inputmode="numeric" id="pfQty" placeholder="0">
    </div>
    <div class="field">
      <label for="pfMin">الحد الأدنى للتنبيه</label>
      <input type="number" inputmode="numeric" id="pfMin" placeholder="5">
    </div>
    <div class="field">
      <label for="pfUnit">وحدة القياس</label>
      <input type="text" id="pfUnit" placeholder="قطعة">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalProduct')">إلغاء</button>
      <button class="btn-solid" onclick="saveProductForm()">حفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SUPABASE_URL = 'https://xxiodivfhkukofsjtrcq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4aW9kaXZmaGt1a29mc2p0cmNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDIzODEsImV4cCI6MjEwMzkxODM4MX0.C89zmJRgishZfVo6UAvNzO-uqD2ck8b21WakKpktt2I';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let currentProductId = null;
let activeCategory = 'الكل';

const $ = id => document.getElementById(id);

function fromRow(r){
  return { id:r.id, name:r.name, sku:r.sku, category:r.category, qty:r.qty, min:r.min_qty, unit:r.unit };
}

async function loadProducts(){
  const { data, error } = await sb.from('products').select('*').order('created_at', {ascending:true});
  if(error){ showToast('تعذر تحميل البيانات'); console.error(error); return; }
  products = data.map(fromRow);
  $('loadingState') && $('loadingState').remove();
  renderFilters();
  renderList();
}

sb.channel('products-changes')
  .on('postgres_changes', { event:'*', schema:'public', table:'products' }, ()=>{
    loadProducts().then(()=>{
      if(document.body.classList.contains('detail-open') && currentProductId){
        const p = products.find(x=>x.id===currentProductId);
        if(p) updateQtyDisplay(p, false);
      }
    });
  })
  .subscribe();

const SIZE_TOKENS = ['XXL','XL','L','M','S','XS'];
function splitVariant(name){
  const parts = name.trim().split(/\s+/);
  const last = parts[parts.length-1].toUpperCase();
  if(SIZE_TOKENS.includes(last) && parts.length>1){
    return { base: parts.slice(0,-1).join(' '), size: last };
  }
  return { base: name, size: null };
}

function statusOf(p){
  if(p.qty <= 0) return 'bad';
  if(p.qty <= p.min) return 'warn';
  return 'good';
}

function categories(){
  const set = new Set(products.map(p=>p.category));
  return ['الكل', ...set];
}

function renderFilters(){
  const row = $('filterRow');
  row.innerHTML = '';
  categories().forEach(c=>{
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (c===activeCategory?' active':'');
    chip.textContent = c;
    chip.setAttribute('role','tab');
    chip.setAttribute('aria-selected', c===activeCategory ? 'true':'false');
    chip.onclick = ()=>{ activeCategory = c; renderFilters(); renderList(); };
    row.appendChild(chip);
  });
}

function renderList(){
  const q = $('search').value.trim().toLowerCase();
  const list = $('list');

  let items = products.filter(p=>{
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
    const matchC = activeCategory==='الكل' || p.category===activeCategory;
    return matchQ && matchC;
  });

  $('subcount').textContent = items.length ? `${items.length} منتج` : '';

  const groups = new Map();
  items.forEach(p=>{
    const { base, size } = splitVariant(p.name);
    const key = base + '||' + p.category;
    if(!groups.has(key)) groups.set(key, { base, category:p.category, variants:[] });
    groups.get(key).variants.push({ ...p, size: size || p.unit });
  });

  const sizeOrder = s => { const i = SIZE_TOKENS.indexOf((s||'').toUpperCase()); return i===-1?99:(SIZE_TOKENS.length-i); };

  const groupList = Array.from(groups.values()).map(g=>{
    g.variants.sort((a,b)=> sizeOrder(b.size) - sizeOrder(a.size));
    const rankMap = {bad:0, warn:1, good:2};
    const worst = g.variants.reduce((acc,v)=>{
      const s = statusOf(v);
      return rankMap[s] < rankMap[acc] ? s : acc;
    }, 'good');
    g.worst = worst;
    g.total = g.variants.reduce((a,v)=>a+v.qty,0);
    return g;
  });

  const rankMap = {bad:0, warn:1, good:2};
  groupList.sort((a,b)=> rankMap[a.worst]-rankMap[b.worst]);

  list.innerHTML = '';

  if(groupList.length===0){
    list.innerHTML = '<div class="empty-state">لا توجد منتجات مطابقة</div>';
    return;
  }

  groupList.forEach(g=>{
    const card = document.createElement('div');
    card.className = 'group-card';
    card.setAttribute('role','listitem');

    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = `
      <div>
        <div class="group-name">${escapeHtml(g.base)}</div>
        <div class="group-cat">${escapeHtml(g.category)}</div>
      </div>
      <div class="group-total">
        <div class="n num">${g.total}</div>
        <div class="l">إجمالي</div>
      </div>
    `;
    card.appendChild(head);

    const rowWrap = document.createElement('div');
    rowWrap.className = 'variant-row';
    g.variants.forEach(v=>{
      const status = statusOf(v);
      const pct = v.min>0 ? Math.min(100, Math.round((v.qty / (v.min*2)) * 100)) : (v.qty>0?100:0);
      const chip = document.createElement('button');
      chip.className = `variant-chip status-${status}`;
      chip.setAttribute('aria-label', `${g.base} مقاس ${v.size}، الكمية ${v.qty}`);
      chip.innerHTML = `
        <span class="size">${escapeHtml(v.size)}</span>
        <span class="healthbar"><span class="healthbar-fill" style="width:${pct}%"></span></span>
        <span class="qty num">${v.qty}</span>
      `;
      chip.onclick = ()=>openDetail(v.id);
      rowWrap.appendChild(chip);
    });
    card.appendChild(rowWrap);
    list.appendChild(card);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

$('search').addEventListener('input', renderList);

function openDetail(id){
  currentProductId = id;
  const p = products.find(x=>x.id===id);
  if(!p) return;
  $('dName').textContent = p.name;
  $('dSku').textContent = p.sku;
  $('dUnit').textContent = p.unit;
  updateQtyDisplay(p, false);
  document.body.classList.add('detail-open');
  $('detail').querySelector('.icon-btn').focus();
}

function closeDetail(){
  document.body.classList.remove('detail-open');
  renderFilters();
  renderList();
}

function updateQtyDisplay(p, animate){
  const el = $('dQty');
  el.textContent = p.qty;
  $('dLowFlag').style.display = (p.qty <= p.min) ? 'block' : 'none';
  if(animate){
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
}

async function bump(delta){
  const p = products.find(x=>x.id===currentProductId);
  if(!p) return;
  const prevQty = p.qty;
  const newQty = Math.max(0, p.qty + delta);
  p.qty = newQty;
  updateQtyDisplay(p, true);
  if(navigator.vibrate) navigator.vibrate(delta>0?15:[10,30,10]);

  const { error } = await sb.from('products').update({ qty:newQty }).eq('id', currentProductId);
  if(error){ p.qty = prevQty; updateQtyDisplay(p, false); showToast('فشل الحفظ، حاول مجدداً'); return; }
  sb.from('stock_movements').insert({
    product_id:currentProductId, change_amount:delta, previous_qty:prevQty, new_qty:newQty,
    movement_type: delta>0 ? 'increment' : 'decrement'
  }).then(()=>{});
}

async function deleteProduct(){
  const p = products.find(x=>x.id===currentProductId);
  if(!p) return;
  if(!confirm(`حذف "${p.name}"؟ لا يمكن التراجع عن هذا.`)) return;
  const { error } = await sb.from('products').delete().eq('id', currentProductId);
  if(error){ showToast('تعذر حذف المنتج'); return; }
  products = products.filter(x=>x.id!==currentProductId);
  closeDetail();
  showToast('تم حذف المنتج');
}

function openManualQtyModal(){
  const p = products.find(x=>x.id===currentProductId);
  $('manualQtyInput').value = p.qty;
  openModal('modalManualQty');
  setTimeout(()=>$('manualQtyInput').focus(), 250);
}
async function saveManualQty(){
  const p = products.find(x=>x.id===currentProductId);
  const v = parseInt($('manualQtyInput').value, 10);
  if(isNaN(v) || v < 0){ showToast('أدخل رقماً صحيحاً'); return; }
  const prevQty = p.qty;
  const { error } = await sb.from('products').update({ qty:v }).eq('id', currentProductId);
  if(error){ showToast('تعذر الحفظ'); return; }
  sb.from('stock_movements').insert({
    product_id:currentProductId, change_amount:v-prevQty, previous_qty:prevQty, new_qty:v,
    movement_type:'manual_correction'
  }).then(()=>{});
  p.qty = v;
  updateQtyDisplay(p, true);
  closeModal('modalManualQty');
  showToast('تم تحديث الكمية');
}

function openAddModal(){
  currentProductId = null;
  $('productModalTitle').textContent = 'إضافة منتج جديد';
  ['pfName','pfSku','pfCategory','pfQty','pfMin','pfUnit'].forEach(id=>$(id).value='');
  $('pfUnit').value = 'قطعة';
  $('pfMin').value = '5';
  openModal('modalProduct');
}

function openEditModal(){
  const p = products.find(x=>x.id===currentProductId);
  if(!p) return;
  $('productModalTitle').textContent = 'تعديل بيانات المنتج';
  $('pfName').value = p.name;
  $('pfSku').value = p.sku;
  $('pfCategory').value = p.category;
  $('pfQty').value = p.qty;
  $('pfMin').value = p.min;
  $('pfUnit').value = p.unit;
  openModal('modalProduct');
}

async function saveProductForm(){
  const name = $('pfName').value.trim();
  const sku = $('pfSku').value.trim();
  if(!name || !sku){ showToast('الاسم والكود مطلوبان'); return; }

  const dupe = products.find(p=>p.sku===sku && p.id!==currentProductId);
  if(dupe){ showToast('هذا الكود مستخدم بالفعل'); return; }

  const data = {
    name,
    sku,
    category: $('pfCategory').value.trim() || 'عام',
    qty: Math.max(0, parseInt($('pfQty').value,10) || 0),
    min_qty: Math.max(0, parseInt($('pfMin').value,10) || 0),
    unit: $('pfUnit').value.trim() || 'قطعة',
  };

  if(currentProductId===null){
    const { data:inserted, error } = await sb.from('products').insert(data).select().single();
    if(error){ showToast('تعذر إضافة المنتج'); console.error(error); return; }
    products.push(fromRow(inserted));
    closeModal('modalProduct');
    renderFilters(); renderList();
    showToast('تمت إضافة المنتج');
  } else {
    const { error } = await sb.from('products').update(data).eq('id', currentProductId);
    if(error){ showToast('تعذر حفظ التعديلات'); console.error(error); return; }
    const p = products.find(x=>x.id===currentProductId);
    Object.assign(p, {name:data.name, sku:data.sku, category:data.category, qty:data.qty, min:data.min_qty, unit:data.unit});
    closeModal('modalProduct');
    $('dName').textContent = p.name;
    $('dSku').textContent = p.sku;
    $('dUnit').textContent = p.unit;
    updateQtyDisplay(p, false);
    showToast('تم حفظ التعديلات');
  }
}

function openModal(id){ $(id).classList.add('open'); }
function closeModal(id){ $(id).classList.remove('open'); }
document.querySelectorAll('.modal-backdrop').forEach(m=>{
  m.addEventListener('click', e=>{ if(e.target===m) closeModal(m.id); });
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    document.querySelectorAll('.modal-backdrop.open').forEach(m=>closeModal(m.id));
    if(document.body.classList.contains('detail-open')) closeDetail();
  }
});

let toastTimer;
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

loadProducts();
</script>
</body>
</html>
